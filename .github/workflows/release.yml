name: 青单发布

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.19.0'

jobs:
  verify:
    name: 完整检查
    uses: ./.github/workflows/check.yml

  package-server:
    name: 独立服务端 Linux 与 macOS 运行时
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: application/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: verified-application
          path: application
      - name: 校验发布版本
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node -e 'const p=require("./application/package.json");if(process.env.RELEASE_REF.startsWith("refs/tags/")&&process.env.RELEASE_REF!=="refs/tags/v"+p.version)throw Error("Tag and application version differ")'
          echo "value=$(node -p 'require("./application/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: 准备当前检查通过的运行目录与锁定依赖
        run: |
          npm ci --prefix application
          node desktop/scripts/prepare-backend.cjs application release-build/app
      - name: 下载并验证官方固定运行时
        run: |
          mkdir -p release-build/node-archives
          for file in SHASUMS256.txt node-v24.19.0-linux-x64.tar.xz node-v24.19.0-darwin-arm64.tar.xz; do
            curl --fail --location --proto '=https' --tlsv1.2 --retry 3 "https://nodejs.org/dist/v24.19.0/$file" -o "release-build/node-archives/$file"
          done
          python3 server-packaging/assemble.py --app release-build/app --nodes release-build/node-archives --output release-build/qingdan-server
      - name: 生成 ZIP 并独立解压验收
        env:
          ASSET_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 server-packaging/zip-release.py release-build/qingdan-server "qingdan-server-v${ASSET_VERSION}.zip"
          python3 server-packaging/verify-release.py --zip "qingdan-server-v${ASSET_VERSION}.zip" --report "qingdan-server-v${ASSET_VERSION}.verification.json"
          sha256sum "qingdan-server-v${ASSET_VERSION}.zip" > "qingdan-server-v${ASSET_VERSION}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ github.sha }}
          if-no-files-found: error
          path: |
            qingdan-server-v${{ steps.version.outputs.value }}.zip
            qingdan-server-v${{ steps.version.outputs.value }}.sha256
            qingdan-server-v${{ steps.version.outputs.value }}.verification.json

  package-macos:
    name: macOS arm64
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            application/package-lock.json
            desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: verified-application
          path: application
      - name: 准备当前内置后端
        run: |
          npm ci --prefix application
          node desktop/scripts/prepare-backend.cjs
          node desktop/scripts/verify-backend.cjs desktop/backend backend-verification-macos.json --smoke
      - name: 构建并校验未签名安装包
        working-directory: desktop
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          node scripts/package.cjs mac --arm64 --dmg --zip
          mkdir -p release
          cp dist/*.dmg dist/*.zip release/
          cp dist/verified-mac-arm64.json ../backend-verification-macos.json docs/MAC-START-HERE.txt release/
          (cd release && shasum -a 256 *.dmg *.zip > SHA256SUMS-macos.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ github.sha }}
          if-no-files-found: error
          path: desktop/release/*

  package-windows:
    name: Windows x64
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            application/package-lock.json
            desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: verified-application
          path: application
      - name: 准备当前内置后端
        shell: bash
        run: |
          npm ci --prefix application
          node desktop/scripts/prepare-backend.cjs
          node desktop/scripts/verify-backend.cjs desktop/backend backend-verification-windows.json --smoke
      - name: 构建并校验 Windows 压缩包
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          npm ci
          node scripts/package.cjs win --x64 --zip
          mkdir -p release
          cp dist/*.zip release/
          cp dist/verified-win-x64.json ../backend-verification-windows.json docs/WINDOWS-START-HERE.txt release/
          (cd release && sha256sum *.zip > SHA256SUMS-windows.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.sha }}
          if-no-files-found: error
          path: desktop/release/*

  publish:
    name: 发布 GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs: [package-server, package-macos, package-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ github.sha }}'
          path: release-assets
          merge-multiple: true
      - name: 发布通过验收的成品
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0)
          test "${#assets[@]}" -gt 0
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "青单 $GITHUB_REF_NAME" "${assets[@]}"
