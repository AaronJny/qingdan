name: 青单发布

on:
  push:
    branches: ['main']
    tags: ['v*.*.*']
    # Updating this file is the intentional release request; ordinary commits do not release.
    paths: ['.github/release/request.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.22.1'

jobs:
  metadata:
    name: 发布版本与明确请求
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      android-version: ${{ steps.meta.outputs.androidVersion }}
      android-version-code: ${{ steps.meta.outputs.androidVersionCode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: meta
        run: node .github/release/metadata.mjs

  verify:
    name: 完整检查
    uses: ./.github/workflows/check.yml
    with:
      release-mode: true

  package-server:
    name: 独立服务端 Linux 与 macOS 运行时
    needs: [metadata, verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: application/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-application
          path: application
      - name: 校验发布版本
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node -e 'const p=require("./application/package.json");if(process.env.RELEASE_REF.startsWith("refs/tags/")&&process.env.RELEASE_REF!=="refs/tags/v"+p.version)throw Error("Tag and application version differ")'
          echo "value=$(node -p 'require("./application/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: 准备当前检查通过的运行目录与锁定依赖
        run: |
          npm ci --prefix application
          node desktop/scripts/prepare-backend.cjs application release-build/app
      - name: 下载并验证官方固定运行时
        run: |
          mkdir -p release-build/node-archives
          for file in SHASUMS256.txt node-v24.22.1-linux-x64.tar.xz node-v24.22.1-darwin-arm64.tar.xz; do
            curl --fail --location --proto '=https' --tlsv1.2 --retry 3 "https://nodejs.org/dist/v24.22.1/$file" -o "release-build/node-archives/$file"
          done
          python3 server-packaging/assemble.py --app release-build/app --nodes release-build/node-archives --output release-build/qingdan-server
      - name: 生成 ZIP 并独立解压验收
        env:
          ASSET_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 server-packaging/zip-release.py release-build/qingdan-server "qingdan-server-v${ASSET_VERSION}.zip"
          python3 server-packaging/verify-release.py --zip "qingdan-server-v${ASSET_VERSION}.zip" --report "qingdan-server-v${ASSET_VERSION}.verification.json"
          sha256sum "qingdan-server-v${ASSET_VERSION}.zip" > "qingdan-server-v${ASSET_VERSION}.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 1
          name: server-${{ github.sha }}
          if-no-files-found: error
          path: |
            qingdan-server-v${{ steps.version.outputs.value }}.zip
            qingdan-server-v${{ steps.version.outputs.value }}.sha256
            qingdan-server-v${{ steps.version.outputs.value }}.verification.json

  package-macos:
    name: macOS ${{ matrix.arch }}
    needs: [metadata, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: |
            application/package-lock.json
            desktop/package-lock.json
      - name: 确认原生 macOS 与目标架构一致
        run: node desktop/scripts/assert-native-macos.cjs ${{ matrix.arch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-application
          path: application
      - name: 准备当前内置后端
        run: |
          npm ci --prefix application
          node desktop/scripts/prepare-backend.cjs
          node desktop/scripts/verify-backend.cjs desktop/backend backend-verification-macos-${{ matrix.arch }}.json --smoke
      - name: 构建并校验 macOS 安装包
        working-directory: desktop
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          # Synthetic stock-Electron renderer proof; no product GUI or Keychain instrumentation claim.
          node scripts/smoke-local-session.cjs --report "${{ runner.temp }}/local-session-${{ matrix.arch }}.json"
          node scripts/package.cjs mac --${{ matrix.arch }} --dmg --zip
          node scripts/verify-desktop-archives.cjs mac --arch ${{ matrix.arch }}
          node scripts/smoke-packaged-mcp.cjs --arch ${{ matrix.arch }} --report "${{ runner.temp }}/packaged-mcp-${{ matrix.arch }}.json"
          # Load the final packaged native binding with stock Electron; never weaken product fuses.
          node scripts/smoke-packaged-recovery.cjs --arch ${{ matrix.arch }} --report "${{ runner.temp }}/packaged-recovery-${{ matrix.arch }}.json"
          python3 ../.github/release/attach-native-smoke.py --arch ${{ matrix.arch }} --package dist/verified-mac-${{ matrix.arch }}.json --local-session "${{ runner.temp }}/local-session-${{ matrix.arch }}.json" --native-binding "${{ runner.temp }}/packaged-recovery-${{ matrix.arch }}.json"
          mkdir -p release
          cp dist/*.dmg dist/*.zip release/
          cp dist/verified-mac-${{ matrix.arch }}.json dist/verified-mac-${{ matrix.arch }}-archives.json ../backend-verification-macos-${{ matrix.arch }}.json docs/MAC-START-HERE.txt release/
          (cd release && shasum -a 256 *.dmg *.zip > SHA256SUMS-macos-${{ matrix.arch }}.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 1
          name: macos-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          path: desktop/release/*

  package-windows:
    name: Windows x64
    needs: [metadata, verify]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            application/package-lock.json
            desktop/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-application
          path: application
      - name: 准备当前内置后端
        shell: bash
        run: |
          npm ci --prefix application
          node desktop/scripts/prepare-backend.cjs
          node desktop/scripts/verify-backend.cjs desktop/backend backend-verification-windows.json --smoke
      - name: 构建并校验 Windows 压缩包
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          npm ci
          node scripts/package.cjs win --x64 --zip
          node scripts/verify-desktop-archives.cjs win
          node scripts/smoke-packaged-mcp.cjs --arch x64 --report "${{ runner.temp }}/packaged-mcp-windows.json"
          mkdir -p release
          cp dist/*.zip release/
          cp dist/verified-win-x64.json dist/verified-win-x64-archives.json ../backend-verification-windows.json docs/WINDOWS-START-HERE.txt release/
          (cd release && sha256sum *.zip > SHA256SUMS-windows.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 1
          name: windows-${{ github.sha }}
          if-no-files-found: error
          path: desktop/release/*

  package-linux:
    name: Linux x64 客户端 AppImage
    needs: [metadata, verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            application/package-lock.json
            desktop/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-application
          path: application
      - name: 准备当前内置后端
        run: |
          npm ci --prefix application
          node desktop/scripts/prepare-backend.cjs
          node desktop/scripts/verify-backend.cjs desktop/backend backend-verification-linux.json --smoke
      - name: 构建与独立验收 AppImage
        working-directory: desktop
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          node scripts/package.cjs linux --x64 --appimage
          xvfb-run --auto-servernum node scripts/smoke-packaged-mcp.cjs --arch x64 --report "${{ runner.temp }}/packaged-mcp-linux.json"
          mkdir -p release
          cp dist/*.AppImage dist/verified-linux-x64.json dist/verified-linux-appimage-x64.json ../backend-verification-linux.json docs/LINUX-START-HERE.txt release/
          (cd release && sha256sum *.AppImage > SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 1
          name: linux-${{ github.sha }}
          if-no-files-found: error
          path: desktop/release/*

  package-android:
    name: Android 可安装发布 APK
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 检查用户已安全配置发布签名
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PYTHON'
          import os
          names = ('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Android installable APK blocked: configure these GitHub Repository Secrets yourself: ' + ', '.join(missing) + '. See android/docs/RELEASE-SIGNING.md. No unsigned APK will be published.')
          PYTHON
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: android/webapp/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: 仅使用已预装授权的 SDK，缺少时停止
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"
      - name: 构建并检查独立 Android 网页与原生代码
        env:
          QINGDAN_ANDROID_VERSION_NAME: ${{ needs.metadata.outputs.android-version }}
          QINGDAN_ANDROID_VERSION_CODE: ${{ needs.metadata.outputs.android-version-code }}
        run: |
          npm ci --prefix android/webapp
          npm run build:web --prefix android
          npm run test:android --prefix android
          npm run test --prefix android/webapp
          npm run test:ui --prefix android/webapp
          npm run test:server --prefix android/webapp
          python3 -m unittest discover -s android/tests -p 'test_*.py' -v
          (cd android/android && gradle --no-daemon -Pandroid.builder.sdkDownload=false securityTests localStorePolicyTests testReleaseUnitTest assembleRelease)
      - name: 用已有发布身份签名并验收安装候选
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          QINGDAN_ANDROID_VERSION_NAME: ${{ needs.metadata.outputs.android-version }}
          QINGDAN_ANDROID_VERSION_CODE: ${{ needs.metadata.outputs.android-version-code }}
        run: |
          mkdir -p android/release
          bash android/scripts/sign-release.sh android/android/app/build/outputs/apk/release/app-release-unsigned.apk "android/release/Qingdan-${QINGDAN_ANDROID_VERSION_NAME}-android.apk"
          (cd android/release && sha256sum *.apk > SHA256SUMS-android.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 1
          name: android-${{ github.sha }}
          if-no-files-found: error
          path: |
            android/release/Qingdan-${{ needs.metadata.outputs.android-version }}-android.apk
            android/release/Qingdan-${{ needs.metadata.outputs.android-version }}-android.apk.verification.json
            android/release/SHA256SUMS-android.txt

  publish:
    name: 汇总成品并发布（缺 APK 时仅草稿）
    if: >-
      always() && !cancelled() &&
      needs.metadata.result == 'success' &&
      needs.package-server.result == 'success' &&
      needs.package-macos.result == 'success' &&
      needs.package-windows.result == 'success' &&
      needs.package-linux.result == 'success'
    permissions:
      contents: write
    needs: [metadata, package-server, package-macos, package-windows, package-linux, package-android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-${{ github.sha }}'
          path: release-assets
          merge-multiple: true
      - name: 精确验收六目标资源并创建正式或草稿 Release
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RESULT: ${{ needs.package-android.result }}
        run: |
          python3 .github/release/publish.py --assets release-assets --android-result "$ANDROID_RESULT" > publish-result.json
          cat publish-result.json
      - name: 保存已通过完整远端验收的发布凭据
        if: success() && needs.package-android.result == 'success'
        run: python3 .github/release/cleanup.py seal --assets release-assets --result publish-result.json --output verified-publication.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && needs.package-android.result == 'success'
        with:
          name: verified-release-publication
          retention-days: 1
          if-no-files-found: error
          path: verified-publication.json
