name: 青单发布

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.19.0'

jobs:
  verify:
    name: 完整检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: application/package-lock.json
      - name: 检查应用
        working-directory: application
        run: |
          npm ci
          npm run check
      - name: 检查桌面封装
        working-directory: desktop
        run: |
          npm ci
          npm test

  package-server:
    name: 服务端 Linux
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: application/package-lock.json
      - name: 构建服务端
        working-directory: application
        run: |
          npm ci
          npm run build
      - name: 打包服务端
        run: |
          mkdir -p release
          cp -a application/dist/server application/dist/client application/dist/offline-build application/package.json application/package-lock.json release/
          cp -a server-packaging/* release/ 2>/dev/null || true
          tar -czf "qingdan-server-${GITHUB_REF_NAME}.tar.gz" -C release .
          sha256sum "qingdan-server-${GITHUB_REF_NAME}.tar.gz" > "qingdan-server-${GITHUB_REF_NAME}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ github.ref_name }}
          path: |
            qingdan-server-${{ github.ref_name }}.tar.gz
            qingdan-server-${{ github.ref_name }}.sha256

  package-macos:
    name: macOS arm64
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 构建未签名安装包
        working-directory: desktop
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          node scripts/package.cjs mac --arm64 --dir
          npx electron-builder --mac --arm64 --publish never -c.mac.identity=null
          mkdir -p release
          cp dist/*.dmg release/ 2>/dev/null || true
          cp dist/*.zip release/ 2>/dev/null || true
          shasum -a 256 release/* > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ github.ref_name }}
          path: desktop/release/*

  package-windows:
    name: Windows x64
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 构建 Windows 压缩包
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          npm ci
          node scripts/package.cjs win --x64 --zip
          mkdir -p release
          cp dist/*.zip release/
          sha256sum release/* > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.ref_name }}
          path: desktop/release/*

  publish:
    name: 发布 GitHub Release
    needs: [package-server, package-macos, package-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find release-assets -type f -exec cp {} . \;
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --title "青单 $GITHUB_REF_NAME" ./*
