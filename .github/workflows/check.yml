name: 青单完整检查

on:
  push:
    branches: ['main']
  pull_request:
  workflow_call:
    inputs:
      release-mode:
        description: 'Enable same-snapshot artifacts and native release gates'
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 源码与运行包检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 避免发布请求重复执行完整检查
        id: scope
        shell: bash
        env:
          CI_RELEASE_MODE: ${{ inputs.release-mode || false }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_BEFORE: ${{ github.event.before }}
        run: |
          run_check=true
          if [[ "$CI_RELEASE_MODE" != "true" && "$CI_EVENT_NAME" == "push" && "$CI_REF" == "refs/heads/main" && "$CI_BEFORE" =~ ^[0-9a-f]{40}$ && "$CI_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            if git cat-file -e "$CI_BEFORE^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$CI_BEFORE"; then
              if changed=$(git diff --name-only "$CI_BEFORE" HEAD -- .github/release/request.json); then
                if [[ -n "$changed" ]]; then
                  run_check=false
                  echo '本次提交明确请求发布，完整检查由发布工作流执行。' >> "$GITHUB_STEP_SUMMARY"
                fi
              else
                echo '::warning::无法比较发布请求，保守执行完整检查。'
              fi
            else
              echo '::warning::无法读取推送前提交，保守执行完整检查。'
            fi
          fi
          echo "run-check=$run_check" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run-check == 'true'
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            application/package-lock.json
            desktop/package-lock.json
      - name: 完整检查应用并记录同快照构建证据
        if: steps.scope.outputs.run-check == 'true'
        working-directory: application
        run: |
          npm ci
          npm run check
      - name: 检查桌面封装
        if: steps.scope.outputs.run-check == 'true'
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          npm run check
      - name: 检查发布成品与权限边界
        if: steps.scope.outputs.run-check == 'true'
        run: python3 -m unittest discover -s .github/release/tests -v
      - name: 检查服务端打包脚本
        if: steps.scope.outputs.run-check == 'true'
        run: python3 -m unittest discover -s server-packaging/tests -v
      - name: 生成并启动验证当前内置后端
        if: steps.scope.outputs.run-check == 'true'
        run: |
          node desktop/scripts/prepare-backend.cjs
          node desktop/scripts/verify-backend.cjs desktop/backend backend-verification.json --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release-mode && steps.scope.outputs.run-check == 'true'
        with:
          retention-days: 1
          name: verified-application
          if-no-files-found: error
          path: |
            application/dist/
            application/tests/standalone-evidence.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release-mode && steps.scope.outputs.run-check == 'true'
        with:
          retention-days: 1
          name: backend-verification
          if-no-files-found: error
          path: backend-verification.json

  native-backend:
    name: 内置后端原生系统检查 (${{ matrix.platform }})
    if: inputs.release-mode
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2022
          - platform: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: application/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-application
          path: application
      - name: 校验跨平台源码快照并启动当前后端
        shell: bash
        run: |
          npm ci --prefix application
          node desktop/scripts/prepare-backend.cjs
          node desktop/scripts/verify-backend.cjs desktop/backend backend-verification-${{ matrix.platform }}.json --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 1
          name: backend-verification-native-${{ matrix.platform }}
          if-no-files-found: error
          path: backend-verification-${{ matrix.platform }}.json
